<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Destinations</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <header>
      <h1>Explore Destinations</h1>

      <nav>
        <span>My Wishlist: <span id="wishlistCount">0</span></span>
      </nav>
    </header>

    <main>
      <p id="message" role="status">Loading destinations...</p>
      <button id="retryBtn" hidden>Retry</button>
      <section id="destinationList" aria-label="Travel destinations"></section>
      <section class="price-alert">
        <h2>Set a Price Alert</h2>

        <form id="priceAlertForm">
          <label for="destinationName">Destination Name:</label>
          <input
            type="text"
            id="destinationName"
            placeholder="Enter destination name"
            required
          />

          <label for="targetPrice">Target Price:</label>
          <input
            type="number"
            id="targetPrice"
            placeholder="Enter your target price"
            min="1"
            required
          />

          <button type="submit">Set Alert</button>

          <p id="alertMessage" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
