
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveller Sign Up</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <div class="container">

        <h1>Traveller Sign Up</h1>
        <p>Create your account and start exploring the world!</p>

        <form action="hotel.html">

            <div class="form-group">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" placeholder="Enter your First Name" required>
            </div>

            <div class="form-group">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" placeholder="Enter your Last Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="text" id="phone" placeholder="Enter Mobile Number" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Sign up</button>

        </form>
    </div>

</body>
</html>
